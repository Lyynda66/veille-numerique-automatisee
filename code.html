<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Code source — Veille stratégique</title>
  <style>
    :root { color-scheme: dark; --bg: #101827; --panel: #151f2f; --muted: #9aabc1; --text: #f3f7fc; --accent: #76e3c2; --line: rgba(194, 214, 237, .13); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px; color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 18% 12%, #1b3850 0, transparent 38%), var(--bg); }
    main { width: min(1050px, 100%); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    nav a { color: var(--accent); text-decoration: none; }
    .source { overflow: auto; min-height: 50vh; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: #d7e3f2; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
    .note { color: var(--muted); font-size: .9rem; }
    @media (max-width: 600px) { body { padding: 20px; } header { align-items: flex-start; flex-direction: column; } .source { padding: 15px; font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Veille stratégique</div><h1>Code source</h1></div>
      <nav><a href="index.html">← Retour à l’aperçu</a></nav>
    </header>
    <p class="note">Source de la page horloge et minuteur (<code>index.html</code>) :</p>
    <pre id="source" class="source" aria-live="polite">Chargement du code…</pre>
  </main>
  <script>
    fetch('./index.html')
      .then((response) => {
        if (!response.ok) throw new Error('Impossible de charger index.html.');
        return response.text();
      })
      .then((html) => { document.querySelector('#source').textContent = html; })
      .catch(() => {
        document.querySelector('#source').textContent = 'Le code source est disponible dans le fichier index.html du dépôt.\n\nPour afficher cette page correctement, ouvrez le site via un serveur web (par exemple GitHub Pages) plutôt qu’en ouvrant le fichier directement.';
      });
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Horloge & minuteur — Veille stratégique</title>
  <style>
    :root { color-scheme: dark; --bg: #101827; --panel: rgba(25, 38, 57, .82); --muted: #9aabc1; --text: #f3f7fc; --accent: #76e3c2; --line: rgba(194, 214, 237, .13); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 18% 12%, #1b3850 0, transparent 38%), radial-gradient(ellipse at 90% 85%, #263354 0, transparent 35%), var(--bg); }
    main { width: min(940px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    nav { display: flex; gap: 8px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.035); }
    nav a { padding: 9px 14px; border-radius: 999px; color: var(--muted); font-size: .88rem; text-decoration: none; }
    nav a[aria-current="page"] { color: var(--text); background: rgba(255,255,255,.1); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { min-height: 340px; padding: clamp(22px, 4vw, 34px); border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 22px 70px rgba(0,0,0,.2); backdrop-filter: blur(16px); }
    .card-head { display: flex; align-items: center; gap: 11px; color: var(--muted); font-size: .9rem; font-weight: 650; }
    .icon { display: grid; width: 35px; height: 35px; place-items: center; border: 1px solid var(--line); border-radius: 11px; color: var(--accent); }
    .clock { margin-top: 44px; font-size: clamp(3rem, 8vw, 5rem); font-variant-numeric: tabular-nums; font-weight: 650; letter-spacing: -.07em; }
    .date { margin-top: 8px; color: var(--muted); text-transform: capitalize; }
    .timer { margin: 32px 0 25px; text-align: center; font-size: clamp(3.2rem, 7vw, 4.8rem); font-variant-numeric: tabular-nums; font-weight: 650; letter-spacing: -.06em; }
    .inputs { display: flex; justify-content: center; align-items: center; gap: 9px; margin: 0 0 19px; }
    input { width: 76px; padding: 10px 8px; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--text); background: rgba(0,0,0,.18); font: inherit; text-align: center; }
    input:focus { border-color: var(--accent); }
    .inputs label { color: var(--muted); font-size: .8rem; }
    .controls { display: flex; justify-content: center; gap: 10px; }
    button { padding: 10px 17px; border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: rgba(255,255,255,.07); font: inherit; font-size: .9rem; font-weight: 650; cursor: pointer; transition: transform .15s, background .15s; }
    button:hover { transform: translateY(-1px); background: rgba(255,255,255,.13); }
    button.primary { border-color: transparent; color: #0c2020; background: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .hint { margin-top: 16px; color: var(--muted); font-size: .8rem; text-align: center; }
    @media (max-width: 680px) { body { padding: 20px; } header { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .card { min-height: 290px; } .clock { margin-top: 32px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Veille stratégique</div><h1>Votre temps, en un coup d’œil.</h1></div>
      <nav aria-label="Navigation principale"><a href="index.html" aria-current="page">Aperçu</a><a href="code.html">Code source</a></nav>
    </header>
    <section class="grid" aria-label="Horloge et minuteur">
      <article class="card">
        <div class="card-head"><span class="icon" aria-hidden="true">◷</span> Heure locale</div>
        <div id="clock" class="clock" role="timer" aria-label="Heure actuelle">--:--:--</div>
        <div id="date" class="date"></div>
      </article>
      <article class="card">
        <div class="card-head"><span class="icon" aria-hidden="true">⏱</span> Minuteur</div>
        <div id="timer" class="timer" role="timer" aria-live="polite">05:00</div>
        <div class="inputs" aria-label="Durée initiale">
          <label for="minutes">Minutes</label><input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">
          <label for="seconds">Secondes</label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
        </div>
        <div class="controls">
          <button id="start" class="primary" type="button">Démarrer</button>
          <button id="reset" type="button">Réinitialiser</button>
        </div>
        <p id="status" class="hint">Choisissez une durée, puis lancez le minuteur.</p>
      </article>
    </section>
  </main>
  <script>
    const clockEl = document.querySelector('#clock');
    const dateEl = document.querySelector('#date');
    const timerEl = document.querySelector('#timer');
    const minutesInput = document.querySelector('#minutes');
    const secondsInput = document.querySelector('#seconds');
    const startButton = document.querySelector('#start');
    const resetButton = document.querySelector('#reset');
    const statusEl = document.querySelector('#status');
    let remaining = 300;
    let intervalId = null;

    function updateClock() {
      const now = new Date();
      clockEl.textContent = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
      dateEl.textContent = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
    }
    function renderTimer() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    function selectedDuration() {
      const mins = Math.max(0, Math.min(999, Number.parseInt(minutesInput.value, 10) || 0));
      const secs = Math.max(0, Math.min(59, Number.parseInt(secondsInput.value, 10) || 0));
      return mins * 60 + secs;
    }
    function stopTimer() {
      window.clearInterval(intervalId);
      intervalId = null;
      startButton.textContent = 'Reprendre';
    }
    function finishTimer() {
      stopTimer();
      remaining = 0;
      renderTimer();
      startButton.disabled = true;
      statusEl.textContent = 'Temps écoulé !';
      document.title = 'Terminé — Minuteur';
    }
    startButton.addEventListener('click', () => {
      if (intervalId !== null) {
        stopTimer();
        statusEl.textContent = 'Minuteur en pause.';
        return;
      }
      if (remaining <= 0) remaining = selectedDuration();
      if (remaining <= 0) {
        statusEl.textContent = 'Saisissez une durée supérieure à zéro.';
        return;
      }
      startButton.textContent = 'Pause';
      startButton.disabled = false;
      statusEl.textContent = 'Minuteur en cours…';
      intervalId = window.setInterval(() => {
        remaining -= 1;
        renderTimer();
        document.title = `${timerEl.textContent} — Minuteur`;
        if (remaining <= 0) finishTimer();
      }, 1000);
    });
    resetButton.addEventListener('click', () => {
      window.clearInterval(intervalId);
      intervalId = null;
      remaining = selectedDuration();
      renderTimer();
      startButton.disabled = false;
      startButton.textContent = 'Démarrer';
      statusEl.textContent = 'Minuteur réinitialisé.';
      document.title = 'Horloge & minuteur — Veille stratégique';
    });
    updateClock();
    window.setInterval(updateClock, 1000);
    renderTimer();
  </script>
</body>
</html>

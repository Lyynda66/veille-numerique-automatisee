<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Shopping Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#8e9a91}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#09100edd}.card{width:min(520px,100%);text-align:center;border:1px solid #ffffff35;border-radius:20px;background:#172426;padding:28px}.card h1{margin:8px;font-size:48px;line-height:.9}.card h1 span{color:#78ddb0}.card p{color:#ccd7d3}.btn{border:0;border-radius:10px;padding:14px 22px;background:#78ddb0;color:#102019;font-weight:900;font-size:17px;cursor:pointer}.hidden{display:none!important}.hud{position:fixed;z-index:5;inset:0;pointer-events:none}.panel{background:#10191ae9;border:1px solid #ffffff2d;border-radius:12px;padding:11px}.list{position:absolute;left:12px;top:12px;width:220px}.list h2{margin:0 0 6px}.list ul{list-style:none;padding:0;margin:0}.list li{display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ffffff15}.done{color:#78ddb0;text-decoration:line-through}.timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font:900 24px monospace}.status{position:absolute;bottom:12px;left:12px;max-width:58%;font-size:13px}.health{position:absolute;bottom:12px;right:12px;width:150px}.bar{height:9px;margin:5px 0;background:#ffffff30;border-radius:8px}.bar i{display:block;width:100%;height:100%;background:#78ddb0;border-radius:8px}.bar.life i{background:#ef6969}.prompt{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:9px 14px;background:#10191af2;border:1px solid #ffffff35;border-radius:9px;font-weight:900}@media(max-width:650px){.list{width:150px;left:6px;top:6px;padding:8px}.list li{font-size:11px}.timer{left:auto;right:6px;top:6px;transform:none;font-size:18px}.status{left:6px;bottom:6px;max-width:54%;font-size:11px}.health{right:6px;bottom:6px;width:110px}.prompt{bottom:115px}}
</style>
</head><body>
<canvas id="game"></canvas>
<div id="hud" class="hud hidden"><div class="panel list"><h2>🛒 Courses</h2><ul id="items"></ul></div><div class="panel timer"><span id="timer">02:30</span></div><div id="status" class="panel status">Collecte les produits puis retourne à la caisse.</div><div class="panel health"><small>VIE</small><div class="bar life"><i id="life"></i></div><small>SPRINT</small><div class="bar"><i id="energy"></i></div></div><div id="prompt" class="prompt hidden"></div></div>
<div id="menu" class="overlay"><main class="card"><h1>ZOMBIE<br><span>SHOPPING RUSH</span></h1><p>Un jeu simple : récupère les produits, évite les zombies, puis paie à la caisse.</p><p><b>ZQSD / WASD</b> bouger · <b>Espace</b> courir · <b>E</b> prendre / payer</p><button class="btn" id="start">COMMENCER</button></main></div>
<div id="end" class="overlay hidden"><main class="card"><h1 id="result"></h1><p id="message"></p><button class="btn" id="again">REJOUER</button></main></div>
<script>
const canvas=document.queryElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,playing=false,last=0,keys={},energy=100,life=3,time=150;
const world={w:1000,h:680};let player={x:500,y:590,r:16,angle:0};
const walls=[];
for(let r=0;r<3;r++)for(let c=0;c<4;c++)walls.push({x:120+c*220,y:150+r*150,w:150,h:58});
const cash={x:500,y:620,w:150,h:35};
const names=['Cola','Pâtes','Lait','Chips','Fruits','Céréales','Baguette','Jus'];
let goals=[],items=[],zombies=[];
function resize(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function worldToScreen(x,y){const scale=Math.min(W/world.w,H/world.h);return{x:(W-world.w*scale)/2+x*scale,y:(H-world.h*scale)/2+y*scale,s:scale}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function overlapCircle(x,y,r,rect){return x+r>rect.x&&x-r<rect.x+rect.w&&y+r>rect.y&&y-r<rect.y+rect.h}
function blocked(x,y){if(x<25||y<25||x>world.w-25||y>world.h-25)return true;return walls.some(w=>overlapCircle(x,y,17,w))}
function start(){goals=[...names].sort(()=>Math.random-.5).slice(0,5).map((name,i)=>({name,got:false}));items=[];const places=[[105,95],[280,95],[470,95],[660,95],[850,95],[110,335],[410,380],[820,350],[920,500],[280,530]];for(let i=0;i<goals.length;i++){const p=places[(i*2+Math.floor(Math.random()*2))%places.length];items.push({x:p[0],y:p[1],name:goals[i].name,taken:false})}zombies=[];for(let i=0;i<6;i++){let x,y;do{x=120+Math.random()*760;y=120+Math.random()*420}while(dist({x,y},player)<250||blocked(x,y));zombies.push({x,y,r:15,speed:i%3===0?65:i%3===1?38:52,type:i%3})}player={x:500,y:590,r:16,angle:0};energy=100;life=3;time=150;playing=true;document.getElementById('menu').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');drawGoals();last=performance.now()}
function drawGoals(){const ul=document.getElementById('items');ul.innerHTML='';for(const g of goals){const li=document.createElement('li');li.innerHTML=`<span>${g.name}</span><b>${g.got?'✓':'0/1'}</b>`;if(g.got)li.className='done';ul.appendChild(li)}}
function finish(win,text){if(!playing)return;playing=false;document.getElementById('end').classList.remove('hidden');document.getElementById('result').textContent=win?'Courses réussies !':'Attrapé !';document.getElementById('message').textContent=text}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'||e.key==='E')interact();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function interact(){if(!playing)return;let nearest=null,min=58;for(const p of items){if(p.taken)continue;const d=dist(player,p);if(d<min){min=d;nearest=p}}if(nearest){nearest.taken=true;const g=goals.find(t=>t.name===nearest.name&&t.got===false);if(g){g.got=true;drawGoals();document.getElementById('status').textContent=g.name+' récupéré !';if(goals.every(t=>t.got))document.getElementById('status').textContent='Liste terminée ! Retourne à la caisse.'}return}if(goals.every(g=>g.got)&&Math.abs(player.x-cash.x)<110&&Math.abs(player.y-cash.y)<75){finish(true,'Tous les produits ont été ramenés à la caisse !')}else document.getElementById('status').textContent='Approche-toi d’un produit ou de la caisse.'}
function update(dt){if(!playing)return;time-=dt;if(time<=0){finish(false,'Le temps est écoulé.');return}const fx=(keys.w||keys.z?1:0)-(keys.s?1:0),sx=(keys.d?1:0)-(keys.a||keys.q?1:0);const len=Math.hypot(fx,sx)||1,sprinting=keys[' ']&&energy>0&&(fx||sx),speed=sprinting?210:130;if(sprinting)energy=Math.max(0,energy-28*dt);else energy=Math.min(100,energy+20*dt);document.getElementById('energy').style.width=energy+'%';if(fx||sx){const nx=player.x+(sx/len)*speed*dt,ny=player.y+(fx/len)*-speed*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;player.angle=Math.atan2(ny-player.y,nx-player.x)}for(const z of zombies){const dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1,nx=z.x+dx/d*z.speed*dt,ny=z.y+dy/d*z.speed*dt;if(!blocked(nx,z.y))z.x=nx;if(!blocked(z.x,ny))z.y=ny;if(d<z.r+player.r){life--;document.getElementById('life').style.width=(life/3*100)+'%';if(life<=0)finish(false,'Un zombie t’a attrapé.');else z.x-=dx/d*90;break}}let prompt=null,best=58;for(const p of items){if(!p.taken&&dist(player,p)<best){prompt='E — prendre '+p.name;best=dist(player,p)}}if(goals.every(g=>g.got)&&Math.abs(player.x-cash.x)<110&&Math.abs(player.y-cash.y)<75)prompt='E — payer à la caisse';const pe=document.getElementById('prompt');if(prompt){pe.textContent=prompt;pe.classList.remove('hidden')}else pe.classList.add('hidden');document.getElementById('timer').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')}`}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1514';ctx.fillRect(0,0,W,H);const q=worldToScreen(0,0),scale=q.s,ox=q.x,oy=q.y;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
ctx.fillStyle='#bbb8aa';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#9d9b90';ctx.lineWidth=2;for(let x=0;x<world.w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
ctx.fillStyle='#d9d1bc';ctx.fillRect(0,0,world.w,30);ctx.fillRect(0,650,world.w,30);ctx.fillRect(0,0,30,680);ctx.fillRect(970,0,30,680);
for(const w of walls){ctx.fillStyle='#566d62';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#c4b187';for(let y=w.y+12;y<w.y+w.h;y+=18)ctx.fillRect(w.x+8,y,w.w-16,5)}ctx.fillStyle='#557a70';ctx.fillRect(cash.x-cash.w/2,cash.y-cash.h/2,cash.w,cash.h);ctx.fillStyle='#ddd9bd';ctx.fillRect(cash.x-30,cash.y-8,60,16);ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText('CAISSE',cash.x,cash.y+7);
for(const p of items)if(!p.taken){ctx.fillStyle='#78ddb0';ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#37413a';ctx.fillRect(p.x-12,p.y-15,24,30);ctx.fillStyle='#eee';ctx.font='bold 10px Arial';ctx.fillText(p.name,p.x,p.y+3)}
for(const z of zombies){ctx.fillStyle=z.type===1?'#9ab05f':z.type===2?'#566a49':'#6f9151';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6c4b55';ctx.fillRect(z.x-10,z.y-2,20,18);ctx.fillStyle='#ead8a4';ctx.fillRect(z.x-7,z.y-9,4,4);ctx.fillRect(z.x+3,z.y-9,4,4)}
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle='#438078';ctx.fillRect(-10,-13,20,26);ctx.fillStyle='#d0a184';ctx.beginPath();ctx.arc(0,-18,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#403128';ctx.beginPath();ctx.arc(0,-20,10,Math.PI,Math.PI*2);ctx.fill();ctx.restore();ctx.restore()
}
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
